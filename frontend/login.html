<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — DecentralWill</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">
      <span class="brand-icon">📜</span>
      <span class="brand-name">DecentralWill</span>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Home</a>
      <a href="about.html" class="nav-link">About</a>
      <a href="register.html" class="nav-link">Register</a>
    </div>
  </nav>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon">🔐</div>
        <h1>Welcome Back</h1>
        <p>Sign in to manage your digital will</p>
      </div>

      <div id="alertBox" class="alert alert-error hidden"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input
            type="email" id="email" name="email"
            class="form-input" placeholder="you@example.com"
            autocomplete="email" required
          />
          <span class="form-error hidden" id="emailError"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-group">
            <input
              type="password" id="password" name="password"
              class="form-input" placeholder="Enter your password"
              autocomplete="current-password" required
            />
            <button type="button" class="input-toggle" id="togglePassword">👁️</button>
          </div>
          <span class="form-error hidden" id="passwordError"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="register.html">Create one →</a></p>
      </div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (typeof Auth !== 'undefined' && Auth.isLoggedIn()) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await Auth.login(
        document.getElementById('email').value,
        document.getElementById('password').value
      );
    });

    document.getElementById('togglePassword').addEventListener('click', () => {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    });
  </script>
</body>
</html>
